# PaySphere reference harness runtime configuration.
#
# Everything here is defaulted so `bash run.sh` works with no environment set;
# every value that a demo might need to move is also an environment variable.
server:
  port: ${PAYSPHERE_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: paysphere
  datasource:
    url: jdbc:h2:file:${PAYSPHERE_DATA_DIR:./data}/ledger;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  jackson:
    # The frozen canonical models are snake_case with timezone-aware ISO-8601
    # instants and forbid unknown fields, so this block is the whole contract
    # translation: Java stays camelCase and nothing is emitted that the platform
    # would reject.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: INFO
    com.novapay.paysphere: INFO

paysphere:
  # Three separate credentials, exactly as the trust boundary describes: the
  # platform's read_only binding never reaches an action, and only a drill
  # credential reaches chaos.
  keys:
    read-only: ${PAYSPHERE_KEY_READ_ONLY:ps-ro-4f1c8a2b6d9e}
    remediation: ${PAYSPHERE_KEY_REMEDIATION:ps-rem-7a3d5e0c1b84}
    drill: ${PAYSPHERE_KEY_DRILL:ps-drill-2c9f6b1a7e35}
    # Held by the config repo's deploy.sh, not by any observability connector.
    deploy: ${PAYSPHERE_KEY_DEPLOY:ps-deploy-8e5b0d3f9c67}
  regions:
    - region-a
    - region-b
  log-file: ${PAYSPHERE_LOG_DIR:./logs}/observe.jsonl
  log-ring-size: 5000
  trace-ring-size: 2000
  trafficgen:
    enabled: ${PAYSPHERE_TRAFFICGEN:true}
    interval-ms: 1000
    payments-per-tick: 4
    seed: 20260901
