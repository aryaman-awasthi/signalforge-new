[project]
name = "signalforge"
version = "0.0.1"
description = "Enterprise incident command centre - app-agnostic core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "pyyaml>=6",
    "argon2-cffi>=23",
    "PyJWT>=2.8",
    "cryptography>=42",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    # The API process itself. These were missing, so a fresh machine that
    # followed the documented install could not start the server.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest", "pip-audit"]  # pip-audit backs artifact 19; see docs/19 for the TLS limitation on this machine

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signalforge*"]

[tool.pytest.ini_options]
testpaths = ["signalforge/tests"]
markers = [
    "req(id): links the test to a REQ id in specs/requirements.yaml (traceability, RTM)",
]
